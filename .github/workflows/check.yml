# Tests + typecheck on every PR and push to main. Deploy stays manual (ADR-0010).
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # node --test runs .ts via type stripping (ADR-0006); 24 = current LTS
          cache: npm
      - run: npm ci
      # worker-configuration.d.ts is generated, not committed; wrangler only parses *.toml, so copy the example first.
      - run: cp wrangler.toml.example wrangler.toml && npx wrangler types
      - run: npm run typecheck
      - run: npm test
